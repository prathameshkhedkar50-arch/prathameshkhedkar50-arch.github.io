<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prathamesh Khedkar — Portfolio Coming Soon</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(17, 25, 40, 0.75);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.125rem;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 16px;
        }

        p {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 1rem;
            margin-bottom: 32px;
        }

        .notify-form {
            display: flex;
            gap: 10px;
            max-width: 420px;
            margin: 0 auto 32px;
        }

        .notify-form input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .notify-form input:focus {
            border-color: var(--accent);
        }

        .notify-form button {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #090d16;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .notify-form button:hover {
            background: var(--accent-hover);
            color: #ffffff;
        }

        .notify-form button:active {
            transform: scale(0.98);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .social-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .social-links a:hover {
            color: var(--text-primary);
        }

        @media (max-width: 480px) {
            .container {
                padding: 36px 24px;
            }
            h1 {
                font-size: 2rem;
            }
            .notify-form {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <span class="badge">Coming Soon</span>
        <h1>Prathamesh Khedkar</h1>
        <div class="subtitle">Portfolio &amp; Projects</div>
        <p>
            I'm currently crafting a new digital home to showcase my latest work, case studies, and experiments. Check back soon or drop your email to get notified at launch.
        </p>

        <form class="notify-form" onsubmit="event.preventDefault(); alert('Thanks! You will be notified when the portfolio goes live.'); this.reset();">
            <input type="email" placeholder="Enter your email address" required>
            <button type="submit">Notify Me</button>
        </form>

        <div class="social-links">
            <a href="mailto:hello@prathameshkhedkar.com">Email</a>
            <a href="#" target="_blank" rel="noopener">LinkedIn</a>
            <a href="#" target="_blank" rel="noopener">GitHub</a>
            <a href="#" target="_blank" rel="noopener">Twitter / X</a>
        </div>
    </main>

</body>
</html>
